<text x="1100" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#0F172A"><tspan x="1100" dy="0">h = 8</tspan><tspan x="1100" dy="27">CARD_DECLINED</tspan><tspan x="1100" dy="27">HTTP 402</tspan></text>
<rect x="717.95" y="115" width="244.10000000000002" height="54" rx="4" fill="white"/>
<text x="840" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#0F172A"><tspan x="840" dy="0">h = 9 · GATEWAY_TIMEOUT</tspan><tspan x="840" dy="27">HTTP 202 · остаётся PENDING</tspan></text>
<rect x="188.6" y="622" width="152.8" height="54" rx="4" fill="white"/>
<text x="265" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#0F172A"><tspan x="265" dy="0">Клиент отменил</tspan><tspan x="265" dy="27">до подтверждения</tspan></text>
<text x="310" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#475569"><tspan x="310" dy="0">Вход в CREATED: проверки QR и сумм пройдены,</tspan><tspan x="310" dy="27">созданы payment_id и резерв QR (HTTP 201).</tspan></text>
<text x="1060" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#9F1239"><tspan x="1060" dy="0">Отмена из PENDING / SUCCESS запрещена: HTTP 409,</tspan><tspan x="1060" dy="27">CANCEL_NOT_ALLOWED; состояние платежа не меняется.</tspan></text>
<text x="800" y="995" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#475569"><tspan x="800" dy="0">Тайм-аут сохраняет резерв QR. CLI возвращает TIMEOUT; в проектной модели это PENDING.</tspan></text>
